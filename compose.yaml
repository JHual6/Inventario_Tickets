services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    environment:
      HCDL_API_URL: http://api:3001
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/hcdl/salud').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 10s
      start_period: 30s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    init: true
    environment:
      HCDL_HOST: "0.0.0.0"
      HCDL_ORIGEN: http://127.0.0.1:3000
      PORT: "3001"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: hcdl
      PGUSER: hcdl
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env de la raíz}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/salud').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 8s
      retries: 12

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: hcdl
      POSTGRES_USER: hcdl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env de la raíz}
    volumes:
      - datos_hcdl:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "hcdl", "-d", "hcdl"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  datos_hcdl:
    external: true
    name: ${HCDL_DB_VOLUME:?Define HCDL_DB_VOLUME con el nombre del volumen existente}
